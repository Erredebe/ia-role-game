<div class="creation-container">
  <div class="creation-layout glass-card">
    <header class="creation-header">
      <h1>Crea tu Partida</h1>
      <p>Define tu destino en este mundo</p>
    </header>

    <div class="stepper">
      <div class="step" [class.active]="currentStep === 1">
        <div class="step-index">1</div>
        <div class="step-label">Universo</div>
      </div>
      <div class="step-line"></div>
      <div class="step" [class.active]="currentStep === 2">
        <div class="step-index">2</div>
        <div class="step-label">Héroe</div>
      </div>
      <div class="step-line"></div>
      <div class="step" [class.active]="currentStep === 3">
        <div class="step-index">3</div>
        <div class="step-label">Atributos</div>
      </div>
    </div>

    <div class="main-steps">
      <app-character-creation-environment-step
        *ngIf="currentStep === 1"
        [environments]="environments"
        [selectedEnvironmentId]="selectedEnvironmentId"
        [currentEnvironment]="currentEnvironment"
        [(customRules)]="customRules"
        (selectEnvironment)="selectEnvironment($event)"
      >
      </app-character-creation-environment-step>

      <app-character-creation-class-step
        *ngIf="currentStep === 2"
        [name]="name"
        [avatarSeed]="avatarSeed"
        [availableClasses]="availableClasses"
        [selectedClassId]="selectedClassId"
        [currentClass]="currentClass"
        [currentEnvironment]="currentEnvironment"
        [avatarConfig]="avatarConfig"
        (nameChange)="name = $event"
        (avatarSeedChange)="avatarSeed = $event"
        (randomizeAvatarSeed)="randomizeAvatarSeed()"
        (selectClass)="selectedClassId = $event"
      >
      </app-character-creation-class-step>

      <app-character-creation-summary-step
        *ngIf="currentStep === 3"
        [stats]="stats"
        [isRolling]="isRolling"
        [currentClass]="currentClass"
        [backstory]="backstory"
        [name]="name"
        [currentEnvironment]="currentEnvironment"
        [customRules]="customRules"
        [initialInventory]="initialInventory"
        (rollStats)="rollStats()"
        (backstoryChange)="backstory = $event"
      >
      </app-character-creation-summary-step>
    </div>

    <footer class="creation-footer">
      <button class="cancel-btn" (click)="router.navigate(['/'])">Cancelar</button>
      <div class="step-actions">
        <button class="secondary-btn" *ngIf="currentStep > 1" (click)="previousStep()">
          Anterior
        </button>
        <span class="creation-status" *ngIf="isCreating">Creando partida...</span>

        <button
          class="submit-btn"
          *ngIf="currentStep < 3"
          (click)="nextStep()"
          [disabled]="(currentStep === 2 && !selectedClassId) || (currentStep === 2 && !name)"
        >
          Siguiente
        </button>

        <button
          class="submit-btn"
          *ngIf="currentStep === 3"
          (click)="finishCreation()"
          [disabled]="!name.trim() || isCreating"
        >
          {{ isCreating ? 'CREANDO...' : 'COMENZAR AVENTURA' }}
        </button>
      </div>
    </footer>
  </div>
</div>
