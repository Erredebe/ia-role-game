<section class="step-content">
  <div class="step-form">
    <div class="input-group">
      <label>Nombre del Aventurero</label>
      <input type="text"
             [(ngModel)]="name"
             (ngModelChange)="nameChange.emit($event)"
             placeholder="Tu nombre..."
             maxlength="20">
    </div>

    <div class="class-selection">
      <label>Clase Disponibles en {{ currentEnvironment.name }}</label>
      <div class="class-grid">
        <div class="class-card"
             *ngFor="let c of availableClasses"
             [class.active]="selectedClassId === c.id"
             (click)="selectClass.emit(c.id)">
          <div class="class-thumb">
            <img *ngIf="c.image"
                 [src]="c.image"
                 [alt]="c.name"
                 loading="lazy">
            <span class="class-icon" *ngIf="!c.image">{{ c.icon }}</span>
          </div>
          <div class="class-info">
            <h4>{{ c.name }}</h4>
            <p>{{ c.description }}</p>
          </div>
        </div>
      </div>
      <p *ngIf="availableClasses.length === 0" class="warning-text">No hay clases disponibles para este entorno.</p>
    </div>
  </div>

  <div class="step-preview">
    <div class="class-preview">
      <div class="class-preview-media" *ngIf="currentClass?.image; else classIcon">
        <img [src]="currentClass?.image"
             [alt]="currentClass?.name || 'Clase'"
             loading="lazy">
      </div>
      <ng-template #classIcon>
        <div class="class-preview-icon">{{ currentClass?.icon || '?' }}</div>
      </ng-template>
      <h3>{{ name || '???' }}</h3>
      <p class="class-badge" *ngIf="currentClass">{{ currentClass.name }}</p>
      <p class="environment-badge">{{ currentEnvironment.name }}</p>
    </div>
  </div>
</section>
