<div class="main-container">
  <!-- Header -->
  <header class="header glass-card nav-glow">
    <h1>RDB- IA ROLE GAME</h1>
    <div class="location">
      <span class="icon">&#x1F4CD;</span>
      {{ state()?.location || 'Explorando...' }}
    </div>
    <div class="header-actions">
      <button class="save-btn" (click)="saveGame()" [disabled]="isSaving || loading()">
        {{ isSaving ? 'GUARDANDO...' : 'GUARDAR' }}
      </button>
      <button class="reset-btn" (click)="goToLanding()">Menu Principal</button>
    </div>
  </header>

  <div class="content-grid">
    <app-character-panel
      [character]="character()"
      [calculatedStats]="calculatedStats()"
      [equipmentList]="getEquipmentList()"
      [equipmentCollapsed]="equipmentCollapsed"
      [inventoryCollapsed]="inventoryCollapsed"
      (toggleEquipment)="toggleEquipment()"
      (toggleInventory)="toggleInventory()"
      (equipItem)="equipItem($event)"
      (unequipItem)="unequipItem($event)"
    >
    </app-character-panel>

    <app-chat-panel
      [displayHistory]="displayHistory()"
      [suggestedActions]="suggestedActions"
      [loading]="loading()"
      [(userInput)]="userInput"
      (sendAction)="sendAction($event)"
    >
    </app-chat-panel>
  </div>
</div>
