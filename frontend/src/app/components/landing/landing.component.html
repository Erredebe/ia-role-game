<div class="landing-container">
  <div class="hero glass-card">
    <h1>RDB- IA ROLE GAME</h1>
    <p>Embárcate en una aventura única guiada por Inteligencia Artificial</p>

    <div class="actions">
      <button class="primary-btn" (click)="newGame()">NUEVA PARTIDA</button>
    </div>

    <!-- Debug info -->
    <div
      style="
        margin-top: 20px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 5px;
        font-size: 12px;
        color: #ccc;
      "
    >
      <pre>{{ debugInfo }}</pre>
      <button
        (click)="testStorage()"
        style="
          margin-top: 10px;
          padding: 5px 10px;
          background: rgba(100, 200, 255, 0.3);
          border: 1px solid #4af;
          cursor: pointer;
        "
      >
        Test Storage
      </button>
      <button
        (click)="clearStorage()"
        style="
          margin-top: 5px;
          margin-left: 5px;
          padding: 5px 10px;
          background: rgba(255, 100, 100, 0.3);
          border: 1px solid #f44;
          cursor: pointer;
        "
      >
        Clear Storage
      </button>
    </div>
  </div>

  <div class="saves-section" *ngIf="savedGames.length > 0">
    <h2>Continuar Partida</h2>
    <div class="save-list">
      <div
        class="save-card glass-card"
        *ngFor="let game of savedGames"
        (click)="continueGame(game.id)"
      >
        <div class="save-info">
          <h3>{{ game.characterName }}</h3>
          <p>{{ game.characterClass }}</p>
          <span class="date">{{ game.updatedAt | date : 'short' }}</span>
        </div>
        <div class="save-action">
          <button>RETOMAR</button>
        </div>
      </div>
    </div>
  </div>
</div>
